<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze Game Enhanced - Fullscreen Ghost</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
            padding: 20px;
            z-index: 1;
        }
        #maze {
            position: relative;
            width: 600px;
            height: 400px;
            border: 5px solid #333;
            background-color: white;
            overflow: hidden;
        }
        .wall {
            position: absolute;
            background-color: #333;
        }
        #start, #end {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
        }
        #start {
            background-color: green;
        }
        #end {
            background-color: red;
        }
        #player {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: blue;
            border-radius: 50%;
            transition: all 0.1s ease;
        }
        #ghost {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Đảm bảo hình ảnh phủ kín màn hình */
            display: none;
            z-index: 1000; /* Đặt trên cùng */
        }
        #stats {
            margin: 20px 0;
            font-size: 18px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stats">
            Time: <span id="timer">0</span>s | 
            Score: <span id="score">0</span>
        </div>
        <div id="maze">
            <div id="start" style="top: 0; left: 0;">Start</div>
            <div id="end" style="bottom: 0; right: 0;">End</div>
            <div id="player"></div>
            <!-- Walls -->
            <div class="wall" style="top: 90px; left: 0; width: 550px; height: 20px;"></div>
            <div class="wall" style="top: 100px; left: 50px; width: 20px; height: 250px;"></div>
            <div class="wall" style="top: 300px; left: 50px; width: 400px; height: 20px;"></div>
            <div class="wall" style="top: 150px; left: 450px; width: 20px; height: 170px;"></div>
            <div class="wall" style="top: 150px; left: 150px; width: 300px; height: 20px;"></div>
            <div class="wall" style="top: 200px; left: 150px; width: 20px; height: 100px;"></div>
        </div>
        <button onclick="resetGame()">Reset Game</button>
    </div>

    <audio id="scareSound" src="https://www.myinstants.com/media/sounds/scream.mp3"></audio>

    <script>
        const maze = document.getElementById("maze");
        const player = document.getElementById("player");
        const walls = document.querySelectorAll(".wall");
        const end = document.getElementById("end");
        const ghost = document.getElementById("ghost");
        const scareSound = document.getElementById("scareSound");
        const timerDisplay = document.getElementById("timer");
        const scoreDisplay = document.getElementById("score");

        let playerPos = { x: 15, y: 15 };
        let gameStarted = false;
        let timer = 0;
        let score = 0;
        let interval;
        const speed = 5;

        // Initialize player position
        player.style.left = playerPos.x + "px";
        player.style.top = playerPos.y + "px";

        // Start game
        document.getElementById("start").addEventListener("mouseenter", () => {
            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }
        });

        // Keyboard controls
        document.addEventListener("keydown", (e) => {
            if (!gameStarted) return;

            let newX = playerPos.x;
            let newY = playerPos.y;

            switch(e.key) {
                case "ArrowUp": newY -= speed; break;
                case "ArrowDown": newY += speed; break;
                case "ArrowLeft": newX -= speed; break;
                case "ArrowRight": newX += speed; break;
            }

            if (checkCollision(newX, newY)) return;

            playerPos.x = Math.max(0, Math.min(newX, 580));
            playerPos.y = Math.max(0, Math.min(newY, 380));
            player.style.left = playerPos.x + "px";
            player.style.top = playerPos.y + "px";

            if (checkWin()) {
                winGame();
            }
        });

        // Collision detection
        function checkCollision(x, y) {
            const playerRect = {
                left: x,
                right: x + 20,
                top: y,
                bottom: y + 20
            };

            for (let wall of walls) {
                const wallRect = wall.getBoundingClientRect();
                const mazeRect = maze.getBoundingClientRect();
                const wallPos = {
                    left: wallRect.left - mazeRect.left,
                    right: wallRect.right - mazeRect.left,
                    top: wallRect.top - mazeRect.top,
                    bottom: wallRect.bottom - mazeRect.top
                };

                if (playerRect.right > wallPos.left &&
                    playerRect.left < wallPos.right &&
                    playerRect.bottom > wallPos.top &&
                    playerRect.top < wallPos.bottom) {
                    return true;
                }
            }
            return false;
        }

        // Check win condition
        function checkWin() {
            const playerRect = {
                left: playerPos.x,
                right: playerPos.x + 20,
                top: playerPos.y,
                bottom: playerPos.y + 20
            };
            const endRect = end.getBoundingClientRect();
            const mazeRect = maze.getBoundingClientRect();
            const endPos = {
                left: endRect.left - mazeRect.left,
                right: endRect.right - mazeRect.left,
                top: endRect.top - mazeRect.top,
                bottom: endRect.bottom - mazeRect.top
            };

            return (playerRect.right > endPos.left &&
                    playerRect.left < endPos.right &&
                    playerRect.bottom > endPos.top &&
                    playerRect.top < endPos.bottom);
        }

        // Timer
        function startTimer() {
            clearInterval(interval);
            interval = setInterval(() => {
                if (gameStarted) {
                    timer++;
                    timerDisplay.textContent = timer;
                }
            }, 1000);
        }

        // Win game with fullscreen scare effect
        function winGame() {
            gameStarted = false;
            clearInterval(interval);
            score += Math.max(1000 - timer * 10, 100);
            scoreDisplay.textContent = score;

            // Show fullscreen ghost and play sound
            ghost.style.display = "block";
            scareSound.play();

            // Hide ghost after 2 seconds and show win message
            setTimeout(() => {
                ghost.style.display = "none";
                alert(`Chúc mừng bạn đã chiến thắng! Thời gian: ${timer}s - Điểm: ${score}`);
            }, 2000);
        }

        // Reset game
        function resetGame() {
            gameStarted = false;
            clearInterval(interval);
            timer = 0;
            timerDisplay.textContent = timer;
            playerPos = { x: 15, y: 15 };
            player.style.left = playerPos.x + "px";
            player.style.top = playerPos.y + "px";
            ghost.style.display = "none";
            scareSound.pause();
            scareSound.currentTime = 0;
        }

        // Prevent leaving maze
        maze.addEventListener("mouseleave", () => {
            if (gameStarted) {
                alert("Không được rời khỏi mê cung!");
                resetGame();
            }
        });
    </script>
</body>
</html>
